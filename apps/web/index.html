<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OnyxFlow — squads, training load and team sheets for a club."
    />
    <title>OnyxFlow</title>
    <script>
      // Runs before first paint so the sheet never flashes the wrong side.
      ;(function () {
        try {
          var stored = localStorage.getItem('onyxflow.theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch {
          /* A browser without storage still gets the light sheet. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
